<h2 mat-dialog-title class="p-5">
  Tạo link mua sản phẩm
</h2>
<div class="p-5">
  <form [formGroup]="createOrderForm" class="max-w-xl mx-auto">
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Số lượng</label>
      <input type="number" id="quantity"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        placeholder="Nhập số lượng" [formControl]="quantity" required />
    </div>
  </form>
</div>

<div class="p-5">
  <button
    class="block text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    type="button" (click)="createLink()">
    Tạo link
  </button>
</div>
